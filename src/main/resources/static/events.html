<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Events · CampusConnect</title><link rel="stylesheet" href="/css/styles.css"></head><body data-page="events"><div id="app"><main class="feature-page events-page"><div class="page-back"><button class="btn btn-ghost btn-auto" onclick="goBack()">← Back</button></div><header class="feature-hero events-hero"><div><span class="feature-kicker">CAMPUS LIFE</span><h1>Campus Events</h1><p>Find what is happening around campus. Events are shared with every logged-in student.</p></div><span class="feature-hero-icon event-mark">EVENTS</span></header><section class="event-create card-accent"><div class="section-label">CREATE EVENT</div><h2>Share a campus event</h2><div class="event-form-grid"><label><span>Event name</span><input id="name" class="form-input" maxlength="160" placeholder="e.g. Freshers orientation"></label><label><span>Date & time</span><input id="date" class="form-input" type="datetime-local"></label><label><span>Location</span><input id="place" class="form-input" maxlength="180" placeholder="e.g. Main hall"></label><label class="event-full"><span>Description</span><textarea id="desc" class="form-input" rows="4" maxlength="2000" placeholder="Tell students what they need to know..."></textarea></label></div><button class="btn btn-primary event-add" onclick="add()">Add event</button></section><section><div class="section-label events-list-label">UPCOMING</div><div id="events"></div></section></main><div id="toast-host"></div></div><script src="/js/app.js"></script><script>
async function render(){const r=await apiFetch('/api/events');const box=document.getElementById('events');if(!r.ok){box.innerHTML=notConnectedStateHTML();return}box.innerHTML=r.data.length?r.data.map(x=>`<section class="event-card"><div class="event-date"><b>${new Date(x.date).toLocaleDateString(undefined,{day:'2-digit',month:'short'})}</b><small>${new Date(x.date).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'})}</small></div><div class="event-copy"><h3>${escapeHtml(x.name)}</h3><div class="event-place">${escapeHtml(x.place)}</div><p>${escapeHtml(x.desc||'')}</p><small>Added by ${escapeHtml(x.createdBy||'CampusConnect')}</small></div></section>`).join(''):emptyStateHTML({icon:ICONS.posts,title:'No events yet',body:'Add the first campus event.'})}
async function add(){const body={name:name.value.trim(),date:date.value,place:place.value.trim(),desc:desc.value.trim()};const r=await apiFetch('/api/events',{method:'POST',body:JSON.stringify(body)});if(!r.ok)return toast(r.data?.message||'Could not add event',true);name.value='';date.value='';place.value='';desc.value='';await render();toast('Event added for the campus')}
requireLogin().then(u=>u&&render());
</script></body></html>
