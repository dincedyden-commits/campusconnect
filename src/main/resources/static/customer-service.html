<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Service — CampusConnect</title><link rel="stylesheet" href="/css/styles.css"></head><body data-page="profile"><div id="app"><main style="padding:20px 16px"><div class="page-back"><button class="btn btn-ghost btn-auto" onclick="goBack()">← Back</button></div><div class="view-title">Customer service</div><div class="post-card"><div class="avatar lg">C</div><h2>Contact CampusConnect Official</h2><p>Need help with your account, a report, marketplace issue or anything else? Contact the official CampusConnect account directly.</p><div id="service"></div></div></main><div id="toast-host"></div></div><script src="/js/app.js"></script><script>(async()=>{await requireLogin();const r=await apiFetch('/api/users/customer-service');const e=document.getElementById('service');if(r.ok&&r.data.available){e.innerHTML=(r.data.contacts||[]).filter(c=>String(c.username||'').toLowerCase()==='campusconnect').map(c=>'<button class="btn btn-primary" style="margin:6px" onclick="location.href=\'/chats.html?userId='+c.userId+'&username='+encodeURIComponent(c.username)+'\'">Message @'+escapeHtml(c.username)+' · CampusConnect Official'+'</button>').join('')}else e.innerHTML='<p class="small-note">The official customer-service account has not been configured yet.</p>'})()</script></body></html>
