<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polls · CampusConnect</title><link rel="stylesheet" href="/css/styles.css"></head><body data-page="polls"><div id="app"><main class="feature-page polls-page"><div class="page-back"><button class="btn btn-ghost btn-auto" onclick="goBack()">← Back</button></div><header class="feature-hero polls-hero"><div><span class="feature-kicker">CAMPUS VOICE</span><h1>Campus Polls</h1><p>Ask questions and collect opinions. Your account can vote only once per poll.</p></div><span class="feature-hero-icon poll-hero-mark">POLL</span></header><section class="poll-create card-accent"><h2>Create a poll</h2><input id="q" class="form-input" maxlength="180" placeholder="What should campus decide?"><div class="poll-options"><input id="a1" class="form-input" maxlength="160" placeholder="Option 1"><input id="a2" class="form-input" maxlength="160" placeholder="Option 2"></div><button class="btn btn-primary" onclick="createPoll()">Create poll</button></section><div id="polls"></div></main><div id="toast-host"></div></div><script src="/js/app.js"></script><script>
async function render(){const r=await apiFetch('/api/polls');const box=document.getElementById('polls');if(!r.ok){box.innerHTML=notConnectedStateHTML();return}box.innerHTML=r.data.length?r.data.map(p=>{const total=(p.v[0]||0)+(p.v[1]||0)||1;return `<section class="poll-card"><div class="poll-head"><span class="poll-dot"></span><div><h3>${escapeHtml(p.q)}</h3><small>${p.v[0]+p.v[1]} votes${p.voted?' · You voted':''}</small></div></div>${p.options.map((o,j)=>{const pct=Math.round((p.v[j]||0)/total*100);return `<button class="poll-option" ${p.voted?'disabled':''} onclick="vote(${p.id},${j})"><span class="poll-fill" style="width:${pct}%"></span><span class="poll-option-text">${escapeHtml(o)} <b>${pct}%</b></span></button>`}).join('')}</section>`}).join(''):emptyStateHTML({icon:ICONS.posts,title:'No polls yet',body:'Create the first campus poll.'})}
async function createPoll(){const body={q:q.value.trim(),a1:a1.value.trim(),a2:a2.value.trim()};const r=await apiFetch('/api/polls',{method:'POST',body:JSON.stringify(body)});if(!r.ok)return toast(r.data?.message||'Could not create poll',true);q.value='';a1.value='';a2.value='';await render();toast('Poll created')}
async function vote(id,option){const r=await apiFetch('/api/polls/'+id+'/vote',{method:'POST',body:JSON.stringify({option})});if(!r.ok)return toast(r.data?.message||'Could not record vote',true);await render();toast('Vote recorded once')}
requireLogin().then(u=>u&&render());
</script></body></html>
