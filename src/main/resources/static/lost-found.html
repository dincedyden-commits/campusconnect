<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lost & Found · CampusConnect</title><link rel="stylesheet" href="/css/styles.css"></head><body data-page="lost-found"><div id="app"><main class="feature-page"><div class="page-back"><button class="btn btn-ghost btn-auto" onclick="goBack()">← Back</button></div><header class="feature-hero lost-hero"><div><span class="feature-kicker">CAMPUS HELP</span><h1>Lost & Found</h1><p>Post a lost or found item. Listings automatically expire after 60 days.</p></div><span class="feature-hero-icon">🔎</span></header><section class="lost-create card-accent"><h2>Post an item</h2><div class="lost-type"><button id="lostBtn" class="type-btn active" onclick="setType('Lost')">I lost something</button><button id="foundBtn" class="type-btn" onclick="setType('Found')">I found something</button></div><input id="title" class="form-input" maxlength="100" placeholder="Item name"><textarea id="desc" class="form-input" maxlength="1000" placeholder="Describe it, where it was lost/found and how to identify it"></textarea><input id="place" class="form-input" maxlength="180" placeholder="Location"><label class="upload-box"><span>📷 Add item photo</span><small>Photo required · JPG, PNG or WEBP</small><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><button class="btn btn-primary" onclick="createItem()">Post to Lost & Found</button></section><div id="items"></div></main><div id="toast-host"></div></div><script src="/js/app.js"></script><script>
let type='Lost';function setType(t){type=t;lostBtn.classList.toggle('active',t==='Lost');foundBtn.classList.toggle('active',t==='Found')}
async function render(){const r=await apiFetch('/api/lost-found');const b=document.getElementById('items');if(!r.ok){b.innerHTML=notConnectedStateHTML();return}b.innerHTML=r.data.length?r.data.map(x=>`<article class="lost-card"><div class="lost-badge ${x.type.toLowerCase()}">${escapeHtml(x.type)}</div>${x.photo?`<img src="${escapeHtml(x.photo)}" alt="${escapeHtml(x.title)}" class="lost-photo">`:''}<div class="lost-content"><h3>${escapeHtml(x.title)}</h3><p>${escapeHtml(x.desc)}</p><small>📍 ${escapeHtml(x.place||'Location not provided')} · ${new Date(x.createdAt).toLocaleString()} · expires ${new Date(x.expiresAt).toLocaleDateString()}</small></div></article>`).join(''):emptyStateHTML({icon:ICONS.search,title:'Nothing posted yet',body:'Lost and found items will appear here.'})}
async function createItem(){const title=document.getElementById('title').value.trim(),desc=document.getElementById('desc').value.trim(),place=document.getElementById('place').value.trim(),file=document.getElementById('photo').files?.[0];if(!title||!desc||!file)return toast('Item name, description and a photo are required',true);if(file.size>10*1024*1024)return toast('Photo must be 10MB or smaller',true);const fd=new FormData();fd.append('file',file);const up=await apiFetch('/api/upload',{method:'POST',body:fd});if(!up.ok)return toast(up.data?.message||'Photo upload failed',true);const r=await apiFetch('/api/lost-found',{method:'POST',body:JSON.stringify({type,title,desc,place,photo:up.data.url})});if(!r.ok)return toast(r.data?.message||'Could not post item',true);['title','desc','place','photo'].forEach(id=>{const e=document.getElementById(id);if(e)e.value=''});await render();toast('Posted to Lost & Found')}
requireLogin().then(u=>u&&render());
</script></body></html>
