<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace — CampusConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body data-page="marketplace">
    <div id="app">

        <div style="flex:1;display:flex;flex-direction:column;">
            <div class="view-title" style="display:flex;justify-content:space-between;align-items:center;">
                Marketplace
                <button class="btn btn-primary btn-auto" style="font-size:13px;" onclick="sellItem()">+ Sell item</button>
            </div>
            <div class="chip-row" role="tablist" aria-label="Marketplace categories">
                <button class="chip active" onclick="loadMarket()">All</button><button class="chip" onclick="loadMarket('Textbooks')">Textbooks</button><button class="chip" onclick="loadMarket('Electronics')">Electronics</button><button class="chip" onclick="loadMarket('Furniture')">Furniture</button>
                <button class="chip" onclick="loadMarket('Free')">Free</button>
            </div>
            <div id="mkt-body" class="market-grid"></div>
        </div>

        <nav class="bottom-nav" aria-label="Primary navigation">
            <a class="nav-item" data-nav="home" href="/index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/></svg><span>Home</span></a>
            <a class="nav-item" data-nav="search" href="/search.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4.2-4.2"/></svg><span>Search</span></a>
            <button class="nav-item nav-post" data-nav="post" onclick="location.href='/index.html?compose=1'" aria-label="Create post"><span class="post-plus"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><span>Post</span></button>
            <button class="nav-item nav-ai" data-nav="ai" onclick="if(typeof openGemini==='function'){openGemini()}else{location.href='/chats.html?ai=1'}" aria-label="Open Campus AI"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3Z"/><path d="m19 16 .7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16Z"/></svg><span>Campus AI</span></button>
            <a class="nav-item" data-nav="profile" href="/profile.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c.5-4.4 3.2-7 8-7s7.5 2.6 8 7"/><path d="M19 3.8v3.4M17.3 5.5h3.4"/></svg><span>Profile</span></a>
        </nav>

        <div id="toast-host"></div>
    </div>

    <script src="/js/app.js"></script>
    <script>
        const mb = document.getElementById('mkt-body');
        async function loadMarket(cat = 'All') {
            await requireLogin();
            const r = await apiFetch('/api/marketplace?category=' + encodeURIComponent(cat));
            if (!r.ok) {
                mb.innerHTML = notConnectedStateHTML();
                return
            }
            mb.innerHTML = r.data.length ? r.data.map(x => `<div class="post-card" id="product-${x.id}"><div class="post-head"><div><b>${escapeHtml(x.title)}</b><div>@${escapeHtml(x.sellerUsername)} · ${escapeHtml(x.location)}</div></div></div>${x.imageUrl?`<img class="post-media" src="${escapeHtml(x.imageUrl)}">`:''}<div class="post-body">${escapeHtml(x.description)}</div><strong>${Number(x.price).toFixed(2)}</strong> ${x.sold?'<span>Sold</span>':''}<div class="post-actions"><button class="btn btn-primary btn-auto" onclick="contactSeller(${x.sellerId},${x.id})">Message seller</button><button class="btn btn-ghost btn-auto" onclick="callSeller(${x.sellerId})">Call seller</button>${x.sellerId===CURRENT_USER_ID&&!x.sold?`<button class="btn btn-ghost btn-auto" onclick="markSold(${x.id})">Mark sold</button>`:''}</div></div>`).join(''):emptyStateHTML({icon:ICONS.bag,title:'No listings yet',body:'Be the first to sell something on your campus.'})}
async function sellItem(){const title=prompt('Item title');if(!title)return;const description=prompt('Description');if(!description)return;const price=prompt('Price (0 for free)','0');const category=prompt('Category','Other');const location=prompt('Location','');const input=document.createElement('input');input.type='file';input.accept='image/*';input.setAttribute('capture','environment');input.click();input.onchange=async()=>{const file=input.files?.[0];if(!file)return toast('Item photo is required — choose or take a picture',true);if(!file.type.startsWith('image/'))return toast('Please choose an image',true);if(file.size>10*1024*1024)return toast('Item photo must be 10MB or smaller',true);const fd=new FormData();fd.append('file',file);const up=await apiFetch('/api/upload',{method:'POST',body:fd});if(!up.ok)return toast(up.data?.message||'Photo upload failed',true);const r=await apiFetch('/api/marketplace',{method:'POST',body:JSON.stringify({title,description,price,category,location,imageUrl:up.data.url})});if(r.ok){toast('Listing created');loadMarket()}else toast(r.data?.message||'Could not create listing',true)}}
async function markSold(id){const r=await apiFetch('/api/marketplace/'+id+'/sold',{method:'POST'});if(r.ok){toast('Marked as sold');loadMarket()}else toast(r.data?.message||'Could not update listing',true)}
function contactSeller(sellerId,productId){window.location.href='/chats.html?userId='+encodeURIComponent(sellerId)+'&productId='+encodeURIComponent(productId);}
function callSeller(sellerId){const ids=[Number(CURRENT_USER_ID),Number(sellerId)].sort((a,b)=>a-b);window.location.href='/calls.html?room=dm-'+ids.join('-')+'&title='+encodeURIComponent('Seller call');}
loadMarket();
    </script>
</body>

</html>
