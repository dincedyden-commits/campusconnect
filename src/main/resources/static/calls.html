<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Call — CampusConnect</title><link rel="stylesheet" href="/css/styles.css"><style>
.call-page{min-height:100vh;padding:18px 16px 40px}.call-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.call-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.video-tile{background:#111;border-radius:18px;min-height:230px;overflow:hidden;position:relative}.video-tile video{width:100%;height:100%;min-height:230px;object-fit:cover}.video-label{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.65);color:#fff;padding:5px 9px;border-radius:999px;font-size:12px}.call-controls{position:sticky;bottom:10px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}.call-controls button{border:0;border-radius:999px;padding:11px 16px}.location-card{margin-top:14px}.small-note{font-size:12px;color:var(--ink-faint)}
</style></head><body><div id="app"><main class="call-page"><div class="call-top"><div><div class="view-title" id="call-title">Video call</div><div class="small-note" id="call-status">Connecting…</div></div><button class="btn btn-ghost btn-auto" onclick="returnFromCall()">← Back</button></div><div id="videos" class="call-grid"></div><section class="post-card" id="call-history" style="margin-top:14px"><h3 style="margin-top:0">Call history</h3><div id="call-history-list" class="small-note">Loading…</div></section><div class="call-controls"><button class="btn btn-primary btn-auto" id="muteBtn" onclick="toggleMute()">Mute</button><button class="btn btn-ghost btn-auto" id="camBtn" onclick="toggleCamera()">Camera off</button><button class="btn btn-ghost btn-auto" id="shareLocationBtn" onclick="openMapsLocation()">Open Google Maps</button><button class="btn btn-danger btn-auto" onclick="leaveCall()">End call</button></div><div id="locationCard" class="post-card location-card" hidden></div></main><div id="toast-host"></div></div><script src="/js/app.js"></script><script>
let ws,localStream,room,title='Call',localId,peers=new Map(); const params=new URLSearchParams(location.search); const returnUrl='/chats.html'; const mode=new URLSearchParams(location.search).get('mode')||'video';
room=params.get('room')||''; title=params.get('title')||'Video call'; document.getElementById('call-title').textContent=title;
function wsUrl(){return (location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws/call'}
function send(o){if(ws?.readyState===1)ws.send(JSON.stringify({...o,room,from:String(localId)}));}
function tile(id,stream,label){let t=document.getElementById('tile-'+id);if(!t){t=document.createElement('div');t.className='video-tile';t.id='tile-'+id;const v=document.createElement('video');v.autoplay=true;v.playsInline=true;t.appendChild(v);const l=document.createElement('div');l.className='video-label';l.textContent=label||'Participant';t.appendChild(l);document.getElementById('videos').appendChild(t)}t.querySelector('video').srcObject=stream;return t}
async function makePeer(remoteId,offer){if(peers.has(remoteId))return peers.get(remoteId);const pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});peers.set(remoteId,pc);localStream?.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>{if(e.candidate)send({type:'ice',to:String(remoteId),candidate:e.candidate})};pc.ontrack=e=>tile(remoteId,e.streams[0],'@'+remoteId);pc.onconnectionstatechange=()=>{if(['failed','closed','disconnected'].includes(pc.connectionState)){pc.close();peers.delete(remoteId)}};if(offer){const o=await pc.createOffer();await pc.setLocalDescription(o);send({type:'offer',to:String(remoteId),description:o})}return pc}
async function handle(n){if(n.from===String(localId))return;if(n.type==='join'){if(String(localId)<String(n.from))await makePeer(n.from,true);return}if(n.type==='offer'){const pc=await makePeer(n.from,false);await pc.setRemoteDescription(n.description);const a=await pc.createAnswer();await pc.setLocalDescription(a);send({type:'answer',to:n.from,description:a});return}if(n.type==='answer'){const pc=peers.get(n.from);if(pc)await pc.setRemoteDescription(n.description);return}if(n.type==='ice'){const pc=peers.get(n.from);if(pc&&n.candidate)try{await pc.addIceCandidate(n.candidate)}catch(e){}return}}
function openMapsLocation(){googleMapsCurrentLocation()}
function returnFromCall(){location.href='/chats.html'}
async function loadCallHistory(){
 const box=document.getElementById('call-history-list');if(!box)return;
 const r=await apiFetch('/api/calls/history');
 if(!r.ok){box.textContent='No call history available yet.';return}
 const rows=r.data||[];box.innerHTML=rows.length?rows.map(x=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)"><span><b>${escapeHtml(x.name||x.username||'CampusConnect user')}</b><br><small>${escapeHtml(x.type||'Call')} · ${timeAgo(x.createdAt)}</small></span><span>${escapeHtml(x.status||'completed')}</span></div>`).join(''):'No calls yet.';
}
async function start(){const u=await requireLogin();if(!u)return;if(!room){toast('Call room missing',true);return} if(mode==='voice'){document.getElementById('call-title').textContent='Voice call · '+title;document.getElementById('camBtn').style.display='none';} else document.getElementById('call-title').textContent='Video call · '+title;localId=u.id;try{localStream=await navigator.mediaDevices.getUserMedia({video:mode!=='voice',audio:true});tile('me',localStream,'You')}catch(e){toast('Camera/microphone permission is required for video calls',true);return}ws=new WebSocket(wsUrl());ws.onopen=()=>{document.getElementById('call-status').textContent='Live call';send({type:'join'});};ws.onmessage=e=>{try{handle(JSON.parse(e.data))}catch(err){}};ws.onclose=()=>document.getElementById('call-status').textContent='Call connection closed';}
function toggleMute(){const t=localStream?.getAudioTracks()[0];if(!t)return;t.enabled=!t.enabled;document.getElementById('muteBtn').textContent=t.enabled?'Mute':'Unmute'}
function toggleCamera(){const t=localStream?.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;document.getElementById('camBtn').textContent=t.enabled?'Camera off':'Camera on'}
function toggleLocation(){if(sharingLocation){navigator.geolocation.clearWatch(watchId);watchId=null;sharingLocation=false;document.getElementById('shareLocationBtn').textContent='Share live location';toast('Location sharing stopped');return}if(!navigator.geolocation){toast('Location is not supported on this device',true);return}sharingLocation=true;document.getElementById('shareLocationBtn').textContent='Stop location sharing';watchId=navigator.geolocation.watchPosition(pos=>{const coords={lat:pos.coords.latitude,lng:pos.coords.longitude};send({type:'location',coords});locations.set(String(localId),coords);renderLocations()},()=>toast('Location permission was denied',true),{enableHighAccuracy:true,maximumAge:5000,timeout:10000})}
function leaveCall(){peers.forEach(p=>p.close());localStream?.getTracks().forEach(t=>t.stop());ws?.close();location.href='/chats.html'}
window.addEventListener('beforeunload',()=>{try{leaveCall()}catch(e){}});loadCallHistory();start();
</script></body></html>
