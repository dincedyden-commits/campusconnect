<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusConnect Admin</title><link rel="stylesheet" href="/css/styles.css"></head><body data-page="profile"><div id="app"><main style="max-width:1100px;margin:auto;padding:20px 16px 100px"><div class="page-back"><button class="btn btn-ghost btn-auto" onclick="goBack()">← Back</button></div><div class="view-title">CampusConnect Admin</div><p class="small-note">Platform management for the reserved @campusconnect account.</p><div id="stats" class="admin-grid"></div><section class="post-card"><h3>Recent accounts</h3><div id="users"></div></section></main><div id="toast-host"></div></div><script src="/js/app.js"></script><script>async function loadAdmin(){const r=await apiFetch('/api/admin/stats');if(!r.ok){toast(r.data?.message||'Admin access required',true);setTimeout(()=>location.href='/index.html',800);return}document.getElementById('stats').innerHTML=Object.entries(r.data).map(([k,v])=>`<div class="stat-card"><strong>${v}</strong><span>${k.replace(/([A-Z])/g,' $1')}</span></div>`).join('');const u=await apiFetch('/api/admin/users');document.getElementById('users').innerHTML=u.ok?u.data.map(x=>`<div class="admin-user"><b>@${escapeHtml(x.username)}</b><span>${escapeHtml(x.fullName)}</span><small>${escapeHtml(x.role)}</small></div>`).join(''):'Could not load users';}loadAdmin();</script></body></html>
