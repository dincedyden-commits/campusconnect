# =========================
# Server Configuration
# =========================
server.port=${PORT:8080}

# =========================
# Aiven MySQL Database
# =========================
spring.datasource.url=jdbc:mysql://campusconnect-db-dincedyden-d923.j.aivencloud.com:22306/defaultdb?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=avnadmin
spring.datasource.password=1qa2ws3ed2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================
# Hikari Connection Pool
# =========================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# =========================
# Serialization & Time Zone
# =========================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=Africa/Lusaka

# =========================
# File Upload Limits
# =========================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
