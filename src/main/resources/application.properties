# ===== Server =====
server.port=${PORT:8080}

# ===== MySQL / CampusConnect database =====
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusconnect}?sslMode=REQUIRED&serverTimezone=Africa/Lusaka
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===== Multipart limits =====
# Media is streamed to S3/R2; no local media persistence
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ===== Logging =====
logging.level.com.campusconnect=INFO

# ===== CampusConnect AI =====
gemini.api.key=${GEMINI_API_KEY:# ===== Server =====
