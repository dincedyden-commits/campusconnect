# =========================
# Server Configuration
# =========================
server.port=${PORT:8080}

# =========================
# Aiven MySQL Database
# =========================
# Standardized environment variables soRender or local env overrides work cleanly
spring.datasource.url=jdbc:mysql://${DB_HOST:campusconnect-db-dincedyden-d923.j.aivencloud.com}:${DB_PORT:22306}/${DB_NAME:defaultdb}?sslMode=REQUIRED&serverTimezone=UTC
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:avnadmin}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:1qa2ws3ed2005}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA / Hibernate
# =========================
spring.jpa.hibernate.ddl-auto=update
# Updated outdated dialect to modern MySQL8Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =========================
# Hikari Connection Pool
# =========================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# =========================
# Serialization & Time Zone
# =========================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.time-zone=Africa/Lusaka

# =========================
# File Upload Limits
# =========================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# =========================
# Logging
# =========================
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# =========================
# Error Handling
# =========================
server.error.include-message=always
server.error.include-binding-errors=always
