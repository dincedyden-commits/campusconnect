# ===== Server =====
server.port=${PORT:8080}

# ===== MySQL / CampusConnect database =====

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:campusconnect}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Africa/Lusaka
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===== JPA / Hibernate =====
# 'update' creates/alters the users and posts tables from the entities
# automatically the first time the app connects — no manual schema needed.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===== Multipart limits (media is streamed to S3/R2; no local media persistence) =====
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ===== Logging =====
logging.level.com.campusconnect=INFO

# ===== CampusConnect AI =====
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# ===== Persistent object storage (AWS S3 or Cloudflare R2) =====
# Disabled by default so CampusConnect starts without S3/R2 credentials.
storage.enabled=${STORAGE_ENABLED:false}
# Configure these environment variables before starting the app.
# Cloudflare R2 example:
#   STORAGE_ENDPOINT=https://<account-id>.r2.cloudflarestorage.com
#   STORAGE_BUCKET=campusconnect-media
#   STORAGE_ACCESS_KEY=<r2-access-key>
#   STORAGE_SECRET_KEY=<r2-secret-key>
#   STORAGE_PUBLIC_BASE_URL=https://cdn.example.com
# AWS S3 can leave STORAGE_ENDPOINT empty and use an S3/CloudFront public base URL.
storage.endpoint=${STORAGE_ENDPOINT:}
storage.bucket=${STORAGE_BUCKET:campusconnect-media}
storage.access-key=${STORAGE_ACCESS_KEY:}
storage.secret-key=${STORAGE_SECRET_KEY:}
storage.region=${STORAGE_REGION:us-east-1}
storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:}

# System accounts are created only if they do not already exist; existing reserved accounts are never overwritten.
system.accounts.enabled=${SYSTEM_ACCOUNTS_ENABLED:true}
system.official.password=${SYSTEM_OFFICIAL_PASSWORD:}
system.admin.password=${SYSTEM_ADMIN_PASSWORD:}

# Session/security hardening
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# Render/proxy support
server.forward-headers-strategy=framework
