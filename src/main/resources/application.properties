spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# ===== Multipart limits =====
# Media is streamed to S3/R2; no local media persistence
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# ===== Logging =====
logging.level.com.campusconnect=INFO

# ===== CampusConnect AI =====
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}

# ===== Persistent object storage (AWS S3 or Cloudflare R2) =====
storage.enabled=${STORAGE_ENABLED:false}

storage.endpoint=${STORAGE_ENDPOINT:}
storage.bucket=${STORAGE_BUCKET:campusconnect-media}
storage.access-key=${STORAGE_ACCESS_KEY:}
storage.secret-key=${STORAGE_SECRET_KEY:}
storage.region=${STORAGE_REGION:us-east-1}
storage.public-base-url=${STORAGE_PUBLIC_BASE_URL:}

# ===== System accounts =====
system.accounts.enabled=${SYSTEM_ACCOUNTS_ENABLED:true}
system.official.password=${SYSTEM_OFFICIAL_PASSWORD:}
system.admin.password=${SYSTEM_ADMIN_PASSWORD:}

# ===== Session / Security =====
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie

# ===== Render / Proxy support =====
server.forward-headers-strategy=framework}
